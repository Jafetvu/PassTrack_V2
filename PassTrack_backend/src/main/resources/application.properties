spring.application.name=passtrack-api

server.port=${BACKEND_PORT:8080}

# Datasource (MySQL 8.0)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:passtrack_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:passtrack_user}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# File Upload (2 MB limit per docs/03-integraciones.md)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
passtrack.storage.upload-dir=${UPLOAD_DIR:/app/uploads}

# JWT Configuration (injected via environment variables)
passtrack.jwt.secret=${JWT_SECRET:}
passtrack.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Actuator
management.endpoints.web.exposure.include=health
