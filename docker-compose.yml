services:
  db:
    image: mysql:8.0
    container_name: passtrack_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-passtrack_db}
      MYSQL_USER: ${MYSQL_USER:-passtrack_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-PassTrackSecret2026!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootSuperSecure2026!}
    volumes:
      - passtrack_db_data:/var/lib/mysql
      - ./PassTrack_backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootSuperSecure2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - passtrack_net

  backend:
    build:
      context: ./PassTrack_backend
      dockerfile: Dockerfile
    container_name: passtrack_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-passtrack_db}
      MYSQL_USER: ${MYSQL_USER:-passtrack_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-PassTrackSecret2026!}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
    volumes:
      - passtrack_uploads:/app/uploads
    networks:
      - passtrack_net

  frontend:
    build:
      context: ./PassTrack_frontend
      dockerfile: Dockerfile
    container_name: passtrack_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - passtrack_net

volumes:
  passtrack_db_data:
  passtrack_uploads:

networks:
  passtrack_net:
    driver: bridge
